name: Daily Green

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  daily-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make a daily commit
        run: |
          git config user.name "mrcxzhou"
          git config user.email "mr.zhouchuanxiong@gmail.com"
          echo "- $(date -u '+%Y-%m-%d %H:%M UTC') daily activity" >> daily-activity.md
          git add daily-activity.md
          git diff --cached --quiet || git commit -m "chore: daily activity $(date -u '+%Y-%m-%d')"
          git push
