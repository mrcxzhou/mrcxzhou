name: Daily Green

on:
  schedule:
    - cron: "*/15 13-17 * * *"
    - cron: "*/15 19-23 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  daily-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: decide
        name: Decide which runs are due today
        run: |
          python3 - << 'PY'
          import hashlib, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          today = now.strftime("%Y-%m-%d")
          now_min = now.hour * 60 + now.minute
          morning_target = 480 + int(hashlib.sha256((today + ":morning").encode()).hexdigest(), 16) % 240
          afternoon_target = 840 + int(hashlib.sha256((today + ":afternoon").encode()).hexdigest(), 16) % 240
          morning_done = afternoon_done = False
          try:
              with open("daily-activity.md", encoding="utf-8") as f:
                  lines = f.read().splitlines()
              morning_done = any(
                  line.startswith(f"- {today} ") and "(morning)" in line for line in lines
              )
              afternoon_done = any(
                  line.startswith(f"- {today} ") and "(afternoon)" in line for line in lines
              )
          except FileNotFoundError:
              pass
          review = now_min >= 1260
          morning_due = (not morning_done) and (
              (480 <= now_min <= 720 and now_min >= morning_target) or review
          )
          afternoon_due = (not afternoon_done) and (
              (840 <= now_min <= 1080 and now_min >= afternoon_target) or review
          )
          due = []
          if morning_due:
              due.append("morning")
          if afternoon_due:
              due.append("afternoon")
          print(f"today={today} now_min={now_min} morning_target={morning_target} afternoon_target={afternoon_target} morning_done={morning_done} afternoon_done={afternoon_done} due={due}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_commit={'true' if due else 'false'}\n")
              out.write(f"runs={','.join(due)}\n")
              out.write(f"today={today}\n")
          PY
      - name: Make the commit(s)
        if: steps.decide.outputs.should_commit == 'true'
        run: |
          git config user.name "mrcxzhou"
          git config user.email "mr.zhouchuanxiong@gmail.com"
          git pull --rebase
          TODAY=$(TZ=America/New_York date '+%Y-%m-%d')
          NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M EST')
          RUNS="${{ steps.decide.outputs.runs }}"
          CHANGED=0
          for SLOT in $(echo "$RUNS" | tr ',' ' '); do
            if grep -q "^- $TODAY .*($SLOT)" daily-activity.md 2>/dev/null; then
              echo "Already did $SLOT today, skipping."
            else
              echo "- $NOW daily activity ($SLOT)" >> daily-activity.md
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ]; then
            git add daily-activity.md
            git diff --cached --quiet || git commit -m "chore: daily activity $TODAY ($RUNS)"
            git push
          else
            echo "Nothing new to commit."
          fi
