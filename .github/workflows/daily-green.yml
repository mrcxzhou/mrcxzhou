name: Daily Green

on:
  schedule:
    - cron: "*/15 13-17 * * *"
    - cron: "*/15 19-23 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  daily-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: decide
        name: Decide how many commits are due today
        run: |
          python3 - << 'PY'
          import hashlib, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          today = now.strftime("%Y-%m-%d")
          now_min = now.hour * 60 + now.minute
          # Random target inside each window, derived from the date so it
          # is stable within the day but different every day.
          morning_target = 480 + int(hashlib.sha256((today + ":morning").encode()).hexdigest(), 16) % 240
          afternoon_target = 840 + int(hashlib.sha256((today + ":afternoon").encode()).hexdigest(), 16) % 240
          # Deep green: 5 commits per slot, 10 per day.
          PER_SLOT = 5
          morning_count = afternoon_count = 0
          try:
              with open("daily-activity.md", encoding="utf-8") as f:
                  lines = f.read().splitlines()
              morning_count = sum(
                  1 for line in lines
                  if line.startswith(f"- {today} ") and "(morning)" in line
              )
              afternoon_count = sum(
                  1 for line in lines
                  if line.startswith(f"- {today} ") and "(afternoon)" in line
              )
          except FileNotFoundError:
              pass
          review = now_min >= 1260  # 21:00 ET fallback review
          morning_due = 0
          afternoon_due = 0
          if (480 <= now_min <= 720 and now_min >= morning_target) or review:
              morning_due = max(0, PER_SLOT - morning_count)
          if (840 <= now_min <= 1080 and now_min >= afternoon_target) or review:
              afternoon_due = max(0, PER_SLOT - afternoon_count)
          print(f"today={today} now_min={now_min} morning_target={morning_target} afternoon_target={afternoon_target} morning_count={morning_count} afternoon_count={afternoon_count} morning_due={morning_due} afternoon_due={afternoon_due}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_commit={'true' if (morning_due or afternoon_due) else 'false'}\n")
              out.write(f"morning_due={morning_due}\n")
              out.write(f"afternoon_due={afternoon_due}\n")
              out.write(f"today={today}\n")
          PY
      - name: Make the commit(s)
        if: steps.decide.outputs.should_commit == 'true'
        run: |
          git config user.name "mrcxzhou"
          git config user.email "mr.zhouchuanxiong@gmail.com"
          # actions/checkout leaves a detached HEAD for schedule events;
          # `git pull --rebase` fails there ("not currently on a branch").
          git fetch origin main --depth=1
          git checkout -B main origin/main
          TODAY=$(TZ=America/New_York date '+%Y-%m-%d')
          for SLOT in morning afternoon; do
            if [ "$SLOT" = "morning" ]; then
              N="${{ steps.decide.outputs.morning_due }}"
            else
              N="${{ steps.decide.outputs.afternoon_due }}"
            fi
            i=0
            while [ "$i" -lt "$N" ]; do
              git pull --rebase
              COUNT=$(grep -c "^- $TODAY .*($SLOT)" daily-activity.md 2>/dev/null || true)
              COUNT=${COUNT:-0}
              if [ "$COUNT" -ge 5 ]; then
                echo "$SLOT already at 5 today, stopping."
                break
              fi
              NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M EST')
              echo "- $NOW daily activity ($SLOT) #$((COUNT+1))" >> daily-activity.md
              git add daily-activity.md
              git diff --cached --quiet || git commit -m "chore: daily activity $TODAY ($SLOT) #$((COUNT+1))"
              git push
              i=$((i+1))
            done
          done
